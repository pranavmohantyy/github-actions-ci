name: Release\n\non:\n  push:\n    tags:\n      - 'v*.*.*'\n\njobs:\n  release:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout code\n        uses: actions/checkout@v2\n      - name: Get version\n        id: get_version\n        run: |\n          echo "VERSION=$(git tag --sort=-v:refname | head -n 1 | sed 's/^v//')" >> $GITHUB_ENV\n      - name: Create Release\n        uses: softprops/action-gh-release@v1\n        with:\n          tag_name: v${{ env.VERSION }}\n          release_name: Release ${{ env.VERSION }}\n          body: |\n            Automated release based on git tags.\n        env:\n          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n